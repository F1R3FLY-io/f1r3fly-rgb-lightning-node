services:
  bitcoind:
    image: registry.gitlab.com/hashbeam/docker/bitcoind:28.1
    command: "-fallbackfee=0.0002"
    environment:
      MYUID: 1000
      MYGID: 1000
      RPCAUTH: "user:84c66d54d736d8b02aaa5b02e07e759b$$cc56c229b2a49ae2bfd5932cc8a6135d435bb9a7ac037ddd351d65936082c03d"
    ports:
      - 18443:18443
    volumes:
      - ./datacore:/srv/app/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=user", "-rpcpassword=password", "getblockchaininfo"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
  electrs:
    image: registry.gitlab.com/hashbeam/docker/electrs:0.10.9
    environment:
      MYUID: 1000
      MYGID: 1000
      BTCPASS: "password"
    volumes:
      - ./dataindex:/srv/app/db
    depends_on:
      bitcoind:
        condition: service_healthy
    ports:
      - 50001:50001
  electrs-http:
    image: electrs-http
    build:
      context: .
      dockerfile: Dockerfile.electrs
    container_name: electrs-http
    ports:
      - "3002:3002"    # HTTP API (Esplora backend)
      - "50002:50002"  # Electrum RPC (different port to avoid conflict)
      - "24224:24224"  # Monitoring
    volumes:
      - electrs-http-data:/data
    command:
      - --network=regtest
      - --daemon-rpc-addr=bitcoind:18443
      - --cookie=user:password
      - --electrum-rpc-addr=0.0.0.0:50002
      - --http-addr=0.0.0.0:3002
      - --monitoring-addr=0.0.0.0:24224
      - --db-dir=/data
      - --jsonrpc-import
      - -vvv
    depends_on:
      bitcoind:
        condition: service_healthy
  proxy:
    image: ghcr.io/rgb-tools/rgb-proxy-server:0.3.0
    ports:
      - 3000:3000

  # ============================================================================
  # F1r3node - Standalone Validator for RGB Contract Deployment
  # ============================================================================
  f1r3node:
    image: f1r3flyindustries/f1r3fly-scala-node:latest
    pull_policy: always
    user: root
    container_name: f1r3node
    ports:
      - "40400:40400"  # Protocol server
      - "40401:40401"  # External gRPC API
      - "40402:40402"  # Internal gRPC API
      - "40403:40403"  # HTTP API
      - "40404:40404"  # Kademlia discovery
      - "40405:40405"  # Admin HTTP API
    volumes:
      - ./ci/conf/standalone.conf:/var/lib/rnode/rnode.conf
      - ./ci/genesis/bonds.txt:/var/lib/rnode/genesis/bonds.txt
      - ./ci/genesis/wallets.txt:/var/lib/rnode/genesis/wallets.txt
      - ./ci/conf/logback.xml:/var/lib/rnode/logback.xml
      - f1r3node-data:/var/lib/rnode/
    environment:
      - STANDALONE_HOST=f1r3node
      - STANDALONE_PRIVATE_KEY=5f668a7ee96d944a4494cc947e4005e172d7ab3461ee5538f1f2a45a835e9657
      - OPENAI_ENABLED=false
    command:
      - -Dlogback.configurationFile=/var/lib/rnode/logback.xml
      - run
      - -s
      - --host=f1r3node
      - --validator-private-key=5f668a7ee96d944a4494cc947e4005e172d7ab3461ee5538f1f2a45a835e9657
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40403/api/status"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  electrs-http-data:
  f1r3node-data:
