# Markdown link check (lychee)
# Canonical standard: docs/common/markdown-link-check-standard.md
# Validates all URLs in markdown files across the repository.
# 403 is accepted alongside 200..=299 because some sites (publisher
# portals, docs behind CDNs) reject unauthenticated/bot requests while
# the URL is still valid; a real broken link returns 404/410. 429 covers
# rate-limited fetches and 503 is transient by definition.
name: Markdown Link Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdown_link_check:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --max-retries 2
            --retry-wait-time 5
            --accept 200..=299,403,429,503
            './**/*.md'
          fail: true
