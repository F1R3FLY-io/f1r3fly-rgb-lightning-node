[package]
name = "rgb-lightning-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"

[[bin]]
name = "rgb-lightning-node"

[dependencies]
amplify = { version = "4.9.0", default-features = false }
anyhow = "1.0.93"
axum = { version = "0.7.7", features = ["multipart"] }
axum-extra = "0.9.4"
# axum-macros = "0.4.2"  # uncomment to use debug_handler
baid58 = "0.4.4"
base64 = "0.22.1"
biscuit-auth = "6.0.0"
bitcoin = "0.32"
bitcoin-bech32 = "0.13"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = "4.5.20"
dirs = "5.0.1"
futures = "0.3"
hex = "0.4" # Standard hex for encode/decode
hex-conservative = { version = "0.3.0", default-features = false } # Used by bitcoin crate
reqwest = { version = "0.11", features = ["blocking", "json", "multipart"] }
lightning = { version = "0.0.125", features = [
	"max_level_trace",
], path = "./rust-lightning/lightning" }
lightning-background-processor = { version = "0.0.125", features = [
	"futures",
], path = "./rust-lightning/lightning-background-processor" }
lightning-block-sync = { version = "0.0.125", features = [
	"rpc-client",
	"tokio",
] }
lightning-invoice = { version = "0.32.0", features = [
	"std",
], path = "./rust-lightning/lightning-invoice" }
lightning-net-tokio = { version = "0.0.125", path = "./rust-lightning/lightning-net-tokio" }
lightning-persister = { version = "0.0.125", path = "./rust-lightning/lightning-persister" }
lightning-rapid-gossip-sync = { version = "0.0.125", path = "./rust-lightning/lightning-rapid-gossip-sync" }
magic-crypt = "4.0.1"
rand = "0.8.5"
regex = { version = "1.11", default-features = false }
# RGB Layer 1 (GitLab private repos - use SSH for local dev)
rgbl1 = { git = "ssh://git@gitlab.com/smart-assets.io/satchel/rgbl1.git", branch = "master" }
rgb-satchel = { git = "ssh://git@gitlab.com/smart-assets.io/satchel/rgb-satchel.git", branch = "master", package = "rgbL1_satchel" }
hypersonic = "0.12.0"
secp256k1 = "0.28.0" # Match f1r3fly-rgb version for proper key derivation
bdk_wallet = "2.2.0"
dotenvy = "0.15"
scrypt = "0.11.0"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14.0"
thiserror = "2.0"
time = { version = "0.3.36", features = ["std"] }
tokio = { version = "1", features = [
	"fs",
	"io-util",
	"macros",
	"rt",
	"rt-multi-thread",
	"signal",
	"sync",
	"net",
	"time",
] }
tokio-util = { version = "0.7.12", features = ["codec"] }
tower-http = { version = "0.6.1", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
typenum = "1.17.0"
uuid = { version = "1.11.0", default-features = false, features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "2.2.0", default-features = false, features = [
	"time",
	"zstd",
] }

[dev-dependencies]
dircmp = "0.2.0"
electrum-client = "0.20.0"
lazy_static = { version = "1.5.0", default-features = false }
once_cell = "1.20.0"
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"multipart",
	"native-tls",
	"stream",
] }
serial_test = "3.1.1"
tracing-test = "0.2.5"

[patch.crates-io]
lightning = { path = "./rust-lightning/lightning" }
lightning-background-processor = { path = "./rust-lightning/lightning-background-processor" }

[lints.rust.unexpected_cfgs]
level = "allow"
